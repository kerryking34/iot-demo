<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IoT 实时监控</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a2e;
    --panel-border: rgba(148, 163, 184, 0.14);
    --text: #e2e8f0;
    --muted: #7c8aa3;
    --temp: #38bdf8;
    --hum: #34d399;
    --ok: #34d399;
    --warn: #fbbf24;
    --err: #f87171;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1000px 500px at 15% -10%, rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(52, 211, 153, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 32px 24px 48px;
  }

  .page { max-width: 1120px; margin: 0 auto; }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .sub {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .sub code {
    color: #93c5fd;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 12px;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 9px 15px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--warn);
    box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.15);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .dot.connected {
    background: var(--ok);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15);
    animation: pulse 2s infinite;
  }

  .dot.error, .dot.disconnected {
    background: var(--err);
    box-shadow: 0 0 0 4px rgba(248, 113, 113, 0.15);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.16); }
    50% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0.05); }
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .card {
    background: linear-gradient(160deg, rgba(255, 255, 255, 0.03), transparent 60%), var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card .label {
    font-size: 13px;
    color: var(--muted);
  }

  .card strong {
    font-size: 30px;
    font-weight: 650;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .card strong small {
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 4px;
  }

  .card.temp strong { color: var(--temp); }
  .card.hum strong { color: var(--hum); }
  .card .meta {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 16px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 16px 10px;
  }

  .panel h2 {
    margin: 0 0 10px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  .panel h2 span { color: var(--text); }

  canvas {
    display: block;
    width: 100%;
    height: 260px;
  }

  .hint {
    margin: 18px 2px 0;
    font-size: 12px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    body { padding: 20px 14px 32px; }
    h1 { font-size: 22px; }
    canvas { height: 220px; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1>IoT 实时监控</h1>
      <p class="sub">MQTT 温度 / 湿度上报 · <code id="topic">-</code></p>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">正在连接…</span>
    </div>
  </header>

  <section class="cards">
    <article class="card temp">
      <span class="label">当前温度</span>
      <strong id="temp">--<small>°C</small></strong>
    </article>
    <article class="card hum">
      <span class="label">当前湿度</span>
      <strong id="hum">--<small>%</small></strong>
    </article>
    <article class="card">
      <span class="label">设备</span>
      <strong id="device" style="font-size:20px">--</strong>
      <span class="meta" id="lastTs">尚未收到数据</span>
    </article>
    <article class="card">
      <span class="label">采样点数</span>
      <strong id="count" style="font-size:20px">0</strong>
      <span class="meta">每 2 秒上报一次</span>
    </article>
  </section>

  <section class="charts">
    <article class="panel">
      <h2>温度 <span>°C</span></h2>
      <canvas id="tempChart"></canvas>
    </article>
    <article class="panel">
      <h2>湿度 <span>%</span></h2>
      <canvas id="humChart"></canvas>
    </article>
  </section>

  <p class="hint">展示最近 60 个采样点，页面通过 SSE 实时接收数据。</p>
</div>

<script>
(function () {
  var MAX_POINTS = 60;
  var points = [];

  var $ = function (id) { return document.getElementById(id); };
  var tempCanvas = $('tempChart');
  var humCanvas = $('humChart');

  function pad2(n) { return String(n).padStart(2, '0'); }

  function fmtTime(ts) {
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }

  function setStatus(status) {
    var dot = $('dot');
    dot.className = 'dot ' + (status.mqtt || 'connecting');
    $('statusText').textContent = status.message || '未知状态';
  }

  function drawChart(canvas, values, color) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;

    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var w = rect.width;
    var h = rect.height;
    ctx.clearRect(0, 0, w, h);

    var pad = { top: 16, right: 14, bottom: 28, left: 46 };
    var plotW = w - pad.left - pad.right;
    var plotH = h - pad.top - pad.bottom;

    if (!values.length) {
      ctx.fillStyle = '#64748b';
      ctx.font = '13px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('等待数据…', w / 2, h / 2);
      return;
    }

    var nums = values.map(function (p) { return p.value; });
    var min = Math.min.apply(null, nums);
    var max = Math.max.apply(null, nums);
    if (min === max) { min -= 1; max += 1; }
    var span = max - min;
    min -= span * 0.15;
    max += span * 0.15;

    // 网格与纵轴刻度
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var rows = 4;
    for (var i = 0; i <= rows; i++) {
      var y = pad.top + (plotH * i) / rows;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
      ctx.lineWidth = 1;
      ctx.moveTo(pad.left, y);
      ctx.lineTo(w - pad.right, y);
      ctx.stroke();

      ctx.fillStyle = '#64748b';
      var val = max - ((max - min) * i) / rows;
      ctx.fillText(val.toFixed(1), pad.left - 8, y);
    }

    var xFor = function (i) {
      return values.length === 1
        ? pad.left + plotW / 2
        : pad.left + (plotW * i) / (values.length - 1);
    };
    var yFor = function (v) {
      return pad.top + plotH - ((v - min) / (max - min)) * plotH;
    };

    // 面积渐变
    var grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
    grad.addColorStop(0, color + '4d');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    values.forEach(function (p, i) {
      var x = xFor(i);
      var y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.lineTo(xFor(values.length - 1), pad.top + plotH);
    ctx.lineTo(xFor(0), pad.top + plotH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // 折线
    ctx.beginPath();
    values.forEach(function (p, i) {
      var x = xFor(i);
      var y = yFor(p.value);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // 最新点
    var lastX = xFor(values.length - 1);
    var lastY = yFor(values[values.length - 1].value);
    ctx.beginPath();
    ctx.arc(lastX, lastY, 6.5, 0, Math.PI * 2);
    ctx.strokeStyle = color + '55';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(lastX, lastY, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    // 横轴时间
    ctx.fillStyle = '#64748b';
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    ctx.fillText(fmtTime(values[0].ts), pad.left, h - pad.bottom + 9);
    ctx.textAlign = 'right';
    ctx.fillText(fmtTime(values[values.length - 1].ts), w - pad.right, h - pad.bottom + 9);
  }

  function render() {
    var last = points[points.length - 1];

    $('count').textContent = points.length;

    if (last) {
      $('temp').innerHTML = last.temperature.toFixed(2) + '<small>°C</small>';
      $('hum').innerHTML = last.humidity.toFixed(2) + '<small>%</small>';
      $('device').textContent = last.deviceId;
      $('lastTs').textContent = '更新于 ' + fmtTime(last.ts);
    }

    drawChart(
      tempCanvas,
      points.map(function (p) { return { ts: p.ts, value: p.temperature }; }),
      '#38bdf8'
    );
    drawChart(
      humCanvas,
      points.map(function (p) { return { ts: p.ts, value: p.humidity }; }),
      '#34d399'
    );
  }

  function addPoint(point) {
    points.push(point);
    if (points.length > MAX_POINTS) points.shift();
    render();
  }

  var source = new EventSource('/api/stream');

  source.addEventListener('meta', function (e) {
    var meta = JSON.parse(e.data);
    $('topic').textContent = meta.topic;
  });

  source.addEventListener('status', function (e) {
    setStatus(JSON.parse(e.data));
  });

  source.addEventListener('history', function (e) {
    points = JSON.parse(e.data).slice(-MAX_POINTS);
    render();
  });

  source.addEventListener('reading', function (e) {
    addPoint(JSON.parse(e.data));
  });

  source.onerror = function () {
    setStatus({ mqtt: 'error', message: '与页面服务断开，正在重连…' });
  };

  window.addEventListener('resize', render);
})();
</script>
</body>
</html>
